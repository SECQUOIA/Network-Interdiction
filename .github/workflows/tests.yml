name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        # No Gurobi license is configured for CI, so Gurobi-dependent tests
        # skip themselves (see tests/test_network_interdiction.py) rather
        # than failing the build. If a WLS (Web License Service) token is
        # ever added as a repo secret, wire it in here via the standard
        # GRB_WLSACCESSID / GRB_WLSSECRET / GRB_LICENSEID env vars and
        # those tests will start actually running instead of skipping.
        # The QAOA backend tests skip here too (no Qiskit or CUDA-Q); the
        # qaoa job below runs them.
        run: python -m pytest tests/ -v

  qaoa:
    # The gate-model QAOA backends (requirements-qaoa.txt) are optional and
    # heavy, so they get their own job instead of slowing down pytest above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-qaoa.txt pytest
      - name: Run QAOA tests
        # Makes a missing backend an error rather than a skip, so this job
        # cannot pass without exercising both backends.
        env:
          REQUIRE_QAOA_BACKENDS: '1'
        run: python -m pytest tests/test_qaoa.py tests/test_qaoa_large.py -v -ra

  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transfer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-qaoa.txt -r requirements-transfer.txt pytest
      - name: Test actual GAT and IBM transfer integrations
        env:
          REQUIRE_TRANSFER_BACKENDS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest tests/test_parameter_transfer.py -v -ra
